<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090c0a">
  <title>Страница не найдена · Secure X</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #090c0a;
      --text: #eef1ed;
      --muted: #a6b0a8;
      --line: #303b33;
      --accent: #d8b36b;
      --green: #a9c6ae;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--background); }
    body {
      min-width: 320px;
      min-height: 100svh;
      margin: 0;
      padding: 0 clamp(20px, 6vw, 88px);
      color: var(--text);
      background: var(--background);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .page {
      width: min(100%, 1160px);
      min-height: 100svh;
      margin: 0 auto;
      display: grid;
      grid-template-rows: 72px 1fr;
    }
    .header {
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      color: #e4e9e4;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .015em;
    }
    .main {
      display: grid;
      place-items: center;
      padding: clamp(40px, 8vh, 100px) 0;
    }
    .error {
      width: min(100%, 950px);
      display: grid;
      grid-template-columns: minmax(240px, .82fr) 1.18fr;
      align-items: center;
      column-gap: clamp(40px, 8vw, 112px);
    }
    .number {
      padding: 8px clamp(24px, 4vw, 48px) 8px 0;
      border-right: 1px solid var(--line);
      color: var(--accent);
      font-size: clamp(112px, 16vw, 184px);
      font-weight: 720;
      line-height: .82;
      letter-spacing: -.105em;
      white-space: nowrap;
    }
    .copy { max-width: 490px; }
    .eyebrow {
      margin: 0 0 16px;
      color: var(--green);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 4.4vw, 52px);
      font-weight: 640;
      line-height: 1.06;
      letter-spacing: -.045em;
    }
    .description {
      max-width: 410px;
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }
    @media (max-width: 760px) {
      body {
        padding-left: max(20px, env(safe-area-inset-left));
        padding-right: max(20px, env(safe-area-inset-right));
      }
      .page { grid-template-rows: 60px 1fr; }
      .main { place-items: start center; padding: clamp(54px, 13vh, 120px) 0 48px; }
      .error {
        width: min(100%, 520px);
        grid-template-columns: 1fr;
        row-gap: 28px;
      }
      .number {
        width: fit-content;
        padding: 0 0 16px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
        font-size: clamp(88px, 25vw, 132px);
      }
      .copy { max-width: 460px; }
      .eyebrow { margin-bottom: 12px; font-size: 10px; }
      h1 { max-width: 390px; font-size: clamp(32px, 9vw, 42px); }
      .description { margin-top: 14px; font-size: 15px; line-height: 1.65; }
    }
    @media (max-width: 380px) {
      body {
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
      }
      .main { padding-top: 48px; }
      .error { row-gap: 24px; }
      .description { font-size: 14px; }
    }
    @media (max-width: 760px) and (max-height: 520px) {
      .main { padding-top: 24px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="header"><span class="brand">Secure X</span></header>
    <main class="main">
      <section class="error" aria-labelledby="title">
        <div class="number" aria-hidden="true">404</div>
        <div class="copy">
          <p class="eyebrow">Адрес не найден</p>
          <h1 id="title">Проверьте ссылку</h1>
          <p class="description">Возможно, в адресе допущена ошибка или ссылка устарела.</p>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
