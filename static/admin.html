<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Secure X — панель</title>
<style>
:root{color-scheme:dark;--bg:#101411;--surface:#191f1b;--surface2:#202822;--surface3:#28332b;--line:#303b33;--text:#edf1eb;--muted:#a6b0a7;--accent:#b7c9ae;--accentink:#172017;--ok:#a8c6a0;--warn:#e1c28c;--bad:#e5a1a1;--shadow:0 18px 48px #05080550;font:16px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{min-height:46px;padding:10px 15px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--text);cursor:pointer;transition:background .15s,border-color .15s}button:hover{background:var(--surface3);border-color:#536052}button:disabled{opacity:.5;cursor:not-allowed}button.primary{background:var(--accent);border-color:var(--accent);color:var(--accentink);font-weight:700}button.danger{color:var(--bad)}input,textarea,select{width:100%;min-height:46px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#121814;color:var(--text);outline:none}input:focus,textarea:focus,select:focus{border-color:#91a38b;box-shadow:0 0 0 3px #91a38b20}textarea{min-height:100px;resize:vertical}label{display:grid;gap:7px;color:var(--muted);font-size:14px}.wrap{width:min(1180px,100%);margin:auto;padding:20px 22px calc(104px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:5px 0 24px}.brandline{display:flex;align-items:center;gap:10px}.brand{font-size:21px;font-weight:760}.subhead,.muted{color:var(--muted)}.subhead{margin-top:3px;font-size:13px}.small{font-size:13px}.badge{display:inline-flex;align-items:center;min-height:27px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--surface2);color:var(--muted);font-size:12px;white-space:nowrap}.badge.ok,.good{color:var(--ok)}.badge.warn,.warn{color:var(--warn)}.bad{color:var(--bad)}.nav{display:flex;gap:7px;padding:0 0 16px;border-bottom:1px solid var(--line);margin-bottom:22px}.nav button{min-height:42px;padding:8px 14px;border-color:transparent;background:transparent;color:var(--muted)}.nav button.active{background:var(--surface2);border-color:var(--line);color:var(--text)}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 17px}.pagehead h1{font-size:24px;line-height:1.2;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,235px),1fr));gap:13px}.stack{display:grid;gap:12px}.card{min-width:0;padding:17px;border:1px solid var(--line);border-radius:15px;background:var(--surface);box-shadow:0 2px 8px #00000010}.metric{margin-top:8px;font-size:26px;line-height:1.2;font-weight:720;overflow-wrap:anywhere}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.usercard,.servercard{display:grid;gap:12px}.usertitle{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.usertitle h3,.servercard h3{margin:0;font-size:17px;line-height:1.3;overflow-wrap:anywhere}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.actions button{width:100%;min-width:0;padding:9px 8px;overflow-wrap:anywhere}.formgrid{display:grid;gap:14px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.check{display:flex;align-items:center;gap:10px;min-height:44px}.check input{flex:0 0 20px;width:20px;min-height:20px;margin:0;accent-color:#9eb395}.notice,.alert,.errorbox{padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--muted)}.alert{border-color:#554a32;color:#e5d2ad}.errorbox{border-color:#5b3737;color:#e8b2b2}.login{width:min(440px,100%);margin:10vh auto 0}.login h1{margin:0 0 6px}.login p{margin:0 0 20px}.hidden{display:none!important}.toast{position:fixed;z-index:9;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:calc(100vw - 28px);padding:12px 16px;border:1px solid #485448;border-radius:12px;background:#242c25;color:var(--text);box-shadow:var(--shadow)}dialog{width:min(680px,calc(100vw - 24px));max-height:88dvh;overflow:auto;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--text);box-shadow:var(--shadow)}dialog::backdrop{background:#070a08c9}.dialoghead{position:sticky;z-index:2;top:-18px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-18px -18px 16px;padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--line)}.dialoghead h2{margin:0;font-size:18px}.preview{max-height:65dvh;overflow:auto;padding:14px;border:1px solid var(--line);border-radius:10px;background:#111713;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.55 ui-monospace,monospace}.limitbox{padding:14px;border:1px solid var(--line);border-radius:12px;background:#141a15}.limittitle{margin-bottom:9px;font-size:14px;color:var(--text);font-weight:650}.limitrow{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:8px}.hint{margin-top:8px;font-size:12px;color:var(--muted)}.spinner{display:inline-block;width:15px;height:15px;border:2px solid #ffffff50;border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:700px){.wrap{padding:14px 14px calc(94px + env(safe-area-inset-bottom))}.top{margin:4px 0 17px}.brand{font-size:19px}.nav{position:fixed;z-index:5;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin:0;padding:7px 8px calc(7px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-bottom:0;background:#141a16f5;backdrop-filter:blur(12px)}.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:54px;padding:4px 2px;border:1px solid transparent;border-radius:10px;font-size:11px;line-height:1.15;white-space:nowrap}.nav button .icon{font-size:17px;line-height:1.2}.nav button.active{background:var(--surface3);border-color:#3d493f}.pagehead h1{font-size:21px}.card{padding:15px;border-radius:13px}.grid{grid-template-columns:1fr 1fr;gap:9px}.grid .card{padding:13px}.metric{font-size:21px}.small{font-size:12px}.actions{gap:7px}.actions button{min-height:46px;font-size:14px}.split{grid-template-columns:1fr;gap:12px}.toast{bottom:calc(78px + env(safe-area-inset-bottom))}.login{margin-top:8vh}}
@media(max-width:380px){.wrap{padding-left:11px;padding-right:11px}.grid{grid-template-columns:1fr}.usertitle{gap:6px}.badge{font-size:11px;padding-inline:8px}.actions button{font-size:13px}.nav button{font-size:10px}}
</style>
</head>
<body><main class="wrap">
<header class="top"><div><div class="brandline"><div class="brand">Secure X</div><span class="badge">ПАНЕЛЬ</span></div><div class="subhead">Управление подписками и серверами</div></div><button id="logout" class="hidden">Выйти</button></header>
<section id="loginView" class="card login"><h1>Вход</h1><p class="muted">Введите данные администратора.</p><form id="loginForm" class="formgrid"><label>Имя пользователя<input name="username" autocomplete="username" required maxlength="128"></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label><button class="primary">Войти</button></form><div id="loginError" class="errorbox hidden"></div></section>
<section id="appView" class="hidden"><nav class="nav" id="nav"><button data-page="dashboard" class="active"><span class="icon">⌂</span><span>Обзор</span></button><button data-page="users"><span class="icon">♙</span><span>Люди</span></button><button data-page="servers"><span class="icon">⌘</span><span>Серверы</span></button><button data-page="settings"><span class="icon">⚙</span><span>Настройки</span></button></nav><div id="content" aria-live="polite"></div></section>
</main><dialog id="modal"><div class="dialoghead"><h2 id="modalTitle">Детали</h2><button type="button" id="closeModal">Закрыть</button></div><div id="modalBody"></div></dialog><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';let csrf='',page='dashboard',toastTimer;const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(message){const el=$('#toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3800)}
async function api(path,opt={}){const headers=new Headers(opt.headers||{});if(csrf&&opt.method&&opt.method!=='GET')headers.set('X-CSRF-Token',csrf);if(opt.body&&typeof opt.body!=='string'){headers.set('Content-Type','application/json');opt.body=JSON.stringify(opt.body)}const response=await fetch(path,{...opt,headers,credentials:'same-origin'});const raw=await response.text();let data;try{data=raw?JSON.parse(raw):null}catch{data=raw}if(!response.ok)throw Error(typeof data==='object'&&data?(data.detail||'Ошибка запроса'):data||'Ошибка запроса');return data}
function showLogin(){$('#loginView').classList.remove('hidden');$('#appView').classList.add('hidden');$('#logout').classList.add('hidden')}function showApp(){$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#logout').classList.remove('hidden');render()}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget),err=$('#loginError');err.classList.add('hidden');try{const r=await api('/api/admin/auth/login',{method:'POST',body:{username:f.get('username'),password:f.get('password')}});csrf=r.csrf_token;showApp()}catch(x){err.textContent=x.message;err.classList.remove('hidden')}});
$('#logout').onclick=async()=>{try{await api('/api/admin/auth/logout',{method:'POST',body:{}})}catch{}csrf='';showLogin()};$('#closeModal').onclick=()=>$('#modal').close();$('#nav').onclick=e=>{const b=e.target.closest('[data-page]');if(!b)return;page=b.dataset.page;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));render()};
function head(title,right){return '<div class="pagehead"><h1>'+title+'</h1>'+(right||'')+'</div>'}function date(v){if(!v)return '—';try{return new Date(v).toLocaleString('ru-RU',{dateStyle:'medium',timeStyle:'short'})}catch{return String(v)}}function bytes(n){n=Number(n)||0;if(!n)return '0 Б';const u=['Б','КБ','МБ','ГБ','ТБ'];let i=0;while(n>=1000&&i<u.length-1){n/=1000;i++}return Number(n.toFixed(i?1:0)).toLocaleString('ru-RU')+' '+u[i]}
function parts(n){if(!n)return{amount:'',unit:'GB'};const opts=[['TB',1e12],['GB',1e9],['MB',1e6]],found=opts.find(x=>n>=x[1])||opts[2];return{amount:String(Number((n/found[1]).toFixed(3))),unit:found[0]}}
function limitControl(prefix,n,title){const p=parts(n);return '<div class="limitbox"><div class="limittitle">'+title+'</div><div class="limitrow"><input data-limit-amount="'+prefix+'" type="number" min="1" step="0.1" value="'+esc(p.amount)+'" placeholder="100" aria-label="Размер лимита"><select data-limit-unit="'+prefix+'" aria-label="Единица лимита"><option value="MB" '+(p.unit==='MB'?'selected':'')+'>МБ</option><option value="GB" '+(p.unit==='GB'?'selected':'')+'>ГБ</option><option value="TB" '+(p.unit==='TB'?'selected':'')+'>ТБ</option></select></div><label class="check"><input data-limit-inherit="'+prefix+'" type="checkbox" '+(n==null?'checked':'')+'> Лимит провайдера</label><div class="hint">Это значение записывается в профиль Happ как лимит/индикатор. Фактический расход и блокировку определяет провайдер: сейчас его статистика общая для аккаунта, поэтому независимые квоты пользователей этот сервис обеспечить не может.</div></div>'}
function readLimit(form,prefix){if(form.querySelector('[data-limit-inherit="'+prefix+'"]').checked)return null;const amount=Number(form.querySelector('[data-limit-amount="'+prefix+'"]').value),unit=form.querySelector('[data-limit-unit="'+prefix+'"]').value,factor={MB:1e6,GB:1e9,TB:1e12}[unit],value=Math.round(amount*factor);if(!Number.isFinite(value)||value<1e6||value>1e12)throw Error('Лимит должен быть от 1 МБ до 1 ТБ');return value}
function resultText(result,label){if(result&&result.drive_sync&&result.drive_sync.ok)return label+' — Drive сразу обновлён';if(result&&result.drive_sync)return label+' — Drive: '+result.drive_sync.message;return label}
async function render(){const c=$('#content');c.innerHTML='<div class="notice"><span class="spinner"></span> Загружаю…</div>';try{if(page==='dashboard')await dashboard(c);else if(page==='users')await users(c);else if(page==='servers')await servers(c);else await settings(c)}catch(e){c.innerHTML='<div class="errorbox">'+esc(e.message)+'</div>'}}
async function dashboard(c){const d=await api('/api/admin/dashboard'),t=d.traffic||{},delivery=d.drive_delivery||{};c.innerHTML=head('Обзор','<button id="retryDriveSync">Обновить Drive</button>')+(!d.database.connected?'<div class="errorbox">'+esc(d.database.error)+'</div>':'')+(d.upstream.warning?'<div class="alert">Апстрим: '+esc(d.upstream.warning)+'. При наличии сохранённой копии она продолжает использоваться.</div>':'')+(!delivery.configured?'<div class="alert">Для мгновенной отправки изменений добавьте в Render DRIVE_SYNC_URL — адрес развёрнутого Apps Script Web App.</div>':'')+(delivery.warning?'<div class="alert">'+esc(delivery.warning)+'</div>':'')+'<div class="grid"><article class="card"><div class="muted small">База данных</div><div class="metric '+(d.database.connected?'good':'bad')+'">'+(d.database.connected?'Подключена':'Недоступна')+'</div><div class="small muted">Supabase</div></article><article class="card"><div class="muted small">Серверы из апстрима</div><div class="metric">'+d.upstream.server_count+'</div><div class="small muted">Обновлено: '+esc(date(d.upstream.last_success_at))+'</div></article><article class="card"><div class="muted small">Пользователи</div><div class="metric">'+d.users.active+' / '+d.users.total+'</div><div class="small muted">активны / всего · отключено '+d.users.disabled+'</div></article><article class="card"><div class="muted small">Трафик аккаунта провайдера</div><div class="metric">'+(t.total===0?'Безлимит':bytes((t.upload||0)+(t.download||0))+' / '+bytes(t.total))+'</div><div class="small muted">Загрузка '+bytes(t.upload)+' · скачивание '+bytes(t.download)+' · срок '+(t.expire?esc(date(t.expire*1000)):'без срока')+'</div></article><article class="card"><div class="muted small">Доставка Google Drive</div><div class="metric '+(delivery.configured?'good':'warn')+'">'+(delivery.configured?'Мгновенная':'Не настроена')+'</div><div class="small muted">Последнее обновление: '+esc(date(delivery.last_success_at))+'</div></article></div>'+(d.sync_errors&&d.sync_errors.length?'<h2 class="section-title">Ошибки доставки</h2><div class="stack">'+d.sync_errors.map(x=>'<article class="card"><b>'+esc(x.name)+'</b><div class="bad small">'+esc(x.last_sync_error)+'</div><div class="muted small">'+esc(date(x.last_synced_at))+'</div></article>').join('')+'</div>':'')}
function modal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').showModal()}async function copy(value){try{await navigator.clipboard.writeText(value)}catch{const el=document.createElement('textarea');el.value=value;document.body.append(el);el.select();document.execCommand('copy');el.remove()}toast('Ссылка скопирована')}
async function users(c){const results=await Promise.all([api('/api/admin/users'),api('/api/admin/settings')]),list=results[0].users,defaultLimit=results[1].settings.default_traffic_limit_bytes;c.innerHTML=head('Пользователи','<button class="primary" id="addUser">＋ Добавить</button>')+(list.length?'<div class="stack">'+list.map(u=>{const expired=u.expires_at&&new Date(u.expires_at).getTime()<=Date.now();return '<article class="card usercard"><div class="usertitle"><h3>'+esc(u.name)+'</h3><span class="badge '+(u.enabled&&!expired?'ok':'warn')+'">'+(u.status==='pending_delete'?'удаляется':expired?'срок истёк':u.enabled?'включён':'отключён')+'</span><span class="badge '+(u.drive_file_id?'ok':'warn')+'">'+(u.drive_file_id?'Drive готов':'ожидает Drive')+'</span></div><div class="muted small">'+esc(u.note||'Без заметки')+' · срок: '+esc(date(u.expires_at)||'без срока')+'</div><div class="small">Лимит в профиле: <b>'+esc(u.traffic_limit_bytes?bytes(u.traffic_limit_bytes):'лимит провайдера')+'</b></div><div class="actions"><button data-edit="'+u.id+'">Изменить</button><button data-servers="'+u.id+'">Серверы</button><button data-preview="'+u.id+'">Предпросмотр</button><button data-link="'+u.id+'" '+(u.drive_file_id?'':'disabled')+'>Ссылка Drive</button><button class="danger" data-delete="'+u.id+'" '+(u.status==='pending_delete'?'disabled':'')+'>Удалить</button></div></article>'}).join('')+'</div>':'<div class="notice">Пользователей пока нет.</div>');$('#addUser').onclick=()=>userForm(null,defaultLimit);c.onclick=async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.edit)userForm(list.find(x=>x.id==b.dataset.edit),defaultLimit);if(b.dataset.servers)await userServers(b.dataset.servers);if(b.dataset.preview){const x=await api('/api/admin/users/'+b.dataset.preview+'/preview');modal('Предпросмотр','<pre class="preview">'+esc(x)+'</pre>')}if(b.dataset.link){const x=await api('/api/admin/users/'+b.dataset.link+'/drive-link');if(x.link)copy(x.link);else toast('Файл ещё не создан в Drive')}if(b.dataset.delete&&confirm('Удалить пользователя и переместить Drive-файл в корзину?')){b.disabled=true;const x=await api('/api/admin/users/'+b.dataset.delete,{method:'DELETE',body:{}});toast(resultText(x,'Пользователь удалён'));await render()}}catch(x){toast(x.message)}}}
function userForm(user,defaultLimit){const current=user?user.traffic_limit_bytes:defaultLimit;modal(user?'Пользователь':'Новый пользователь','<form id="userForm" class="formgrid"><label>Имя<input name="name" required maxlength="120" value="'+esc(user?user.name:'')+'"></label><label>Заметка<textarea name="note" maxlength="2000">'+esc(user?user.note:'')+'</textarea></label><label>Срок действия<input name="expires_at" type="datetime-local" value="'+(user&&user.expires_at?new Date(user.expires_at).toISOString().slice(0,16):'')+'"></label><label class="check"><input name="enabled" type="checkbox" '+(user&&user.enabled===false?'':'checked')+'> Подписка включена</label>'+limitControl('user',current,'Лимит трафика в профиле')+'<label>Заголовок профиля<input name="title_override" maxlength="200" value="'+esc(user?user.title_override:'')+'" placeholder="По умолчанию из настроек"></label><label>Объявление<textarea name="announce_override" maxlength="4000" placeholder="Пусто — общее объявление">'+esc(user?user.announce_override:'')+'</textarea></label><button class="primary" type="submit">Сохранить и обновить Drive</button></form>');$('#userForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget;if(f.dataset.busy==='1')return;f.dataset.busy='1';const submit=f.querySelector('[type="submit"]'),original=submit.textContent;submit.disabled=true;submit.innerHTML='<span class="spinner"></span> Сохраняю и обновляю Drive…';const d=new FormData(f),exp=d.get('expires_at');try{const body={name:d.get('name'),note:d.get('note'),enabled:d.has('enabled'),expires_at:exp?new Date(exp).toISOString():null,title_override:d.get('title_override')||null,announce_override:d.get('announce_override')||null,traffic_limit_bytes:readLimit(f,'user')};const x=await api(user?'/api/admin/users/'+user.id:'/api/admin/users',{method:user?'PUT':'POST',body});$('#modal').close();toast(resultText(x,'Сохранено'));await render()}catch(x){f.dataset.busy='0';submit.disabled=false;submit.textContent=original;toast(x.message)}}}
async function userServers(id){const data=await api('/api/admin/users/'+id+'/servers');modal('Серверы пользователя','<div class="stack">'+data.servers.map(s=>'<div class="card"><b>'+esc(s.user_name||s.global_name||s.original_name)+'</b><div class="small muted">'+esc(s.original_name)+(s.present_upstream?'':' · отсутствует в апстриме')+'</div><label>Имя для пользователя<input data-us-name="'+s.id+'" value="'+esc(s.user_name||'')+'"></label><label class="check"><input type="checkbox" data-us-hidden="'+s.id+'" '+(s.user_hidden===true?'checked':'')+'> Скрыть у этого пользователя</label><button data-us-save="'+s.id+'">Сохранить и обновить Drive</button></div>').join('')+'</div>');$('#modalBody').onclick=async e=>{const b=e.target.closest('[data-us-save]');if(!b)return;const id2=b.dataset.usSave;b.disabled=true;try{const x=await api('/api/admin/users/'+id+'/servers/'+id2,{method:'PUT',body:{hidden:$('[data-us-hidden="'+id2+'"]').checked,custom_name:$('[data-us-name="'+id2+'"]').value||null}});toast(resultText(x,'Изменение сохранено'))}catch(x){b.disabled=false;toast(x.message)}}}

async function settings(c){const s=(await api('/api/admin/settings')).settings;function textarea(name,label){return '<label>'+label+'<textarea name="'+name+'">'+esc((s[name]||[]).join('\n'))+'</textarea></label>'}c.innerHTML=head('Настройки')+'<form id="settingsForm" class="card formgrid"><label>Название профиля<input name="title" maxlength="200" value="'+esc(s.title)+'"></label><label>Поддержка<input name="support_url" value="'+esc(s.support_url)+'"></label><label>Страница профиля<input name="web_page_url" value="'+esc(s.web_page_url)+'"></label><div class="split"><label>Интервал обновления (часы)<input name="update_interval" type="number" min="1" max="168" value="'+s.update_interval+'"></label><label>Часовой пояс<input name="timezone" value="'+esc(s.timezone)+'"></label></div>'+limitControl('default',s.default_traffic_limit_bytes,'Лимит в профиле новых пользователей')+'<div class="notice small">Новым пользователям это значение записывается в метаданные Happ. Реальную квоту и блокировку задаёт провайдер; его счётчик сейчас общий для всего аккаунта.</div><label class="check"><input name="announce_enabled" type="checkbox" '+(s.announce_enabled?'checked':'')+'> Объявления включены</label><label>Частота обновления объявления (минуты)<input name="announce_refresh_minutes" type="number" min="5" max="1440" value="'+(s.announce_refresh_minutes||5)+'"></label><div class="notice small">При 10+ пользователях рекомендуем 60 минут, чтобы сократить расход квоты Apps Script. Минимум — 5 минут.</div>'+textarea('days','Дни недели — по одному на строку')+textarea('quotes','Цитаты — по одной на строку')+textarea('footers','Нижние строки; {t} заменяется временем')+'<button class="primary" type="submit">Сохранить и обновить Drive</button></form>';$('#settingsForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget;if(f.dataset.busy==='1')return;f.dataset.busy='1';const submit=f.querySelector('[type="submit"]'),original=submit.textContent;submit.disabled=true;submit.innerHTML='<span class="spinner"></span> Сохраняю и обновляю Drive…';const d=new FormData(f);try{const values={title:d.get('title'),support_url:d.get('support_url'),web_page_url:d.get('web_page_url'),update_interval:Number(d.get('update_interval')),timezone:d.get('timezone'),announce_enabled:d.has('announce_enabled'),announce_refresh_minutes:Number(d.get('announce_refresh_minutes')),default_traffic_limit_bytes:readLimit(f,'default'),days:d.get('days').split('\n').map(x=>x.trim()).filter(Boolean),quotes:d.get('quotes').split('\n').map(x=>x.trim()).filter(Boolean),footers:d.get('footers').split('\n').map(x=>x.trim()).filter(Boolean)};const x=await api('/api/admin/settings',{method:'PUT',body:{values}});toast(resultText(x,'Настройки сохранены'))}catch(x){f.dataset.busy='0';submit.disabled=false;submit.textContent=original;toast(x.message)}}}
