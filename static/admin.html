<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light"><title>Панель Secure X</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141b2f;--panel2:#1b2540;--line:#293552;--text:#eff3ff;--muted:#9ba9c7;--accent:#8b9cff;--good:#58d6a0;--bad:#ff7788;--warn:#ffd479;font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -30%,#243466 0,transparent 55%),var(--bg);color:var(--text);min-height:100vh}button,input,textarea,select{font:inherit}button{min-height:46px;padding:10px 15px;border:1px solid var(--line);border-radius:13px;background:var(--panel2);color:var(--text);cursor:pointer}button.primary{background:var(--accent);color:#101629;border:0;font-weight:700}button.danger{color:var(--bad)}button:disabled{opacity:.55;cursor:wait}input,textarea,select{width:100%;min-height:46px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#0f1629;color:var(--text)}textarea{min-height:100px;resize:vertical}label{display:grid;gap:6px;color:var(--muted);font-size:14px}.wrap{max-width:1100px;margin:auto;padding:18px 16px calc(92px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 22px}.brand{font-size:21px;font-weight:750;letter-spacing:.2px}.badge{border-radius:99px;padding:5px 10px;background:#202c49;color:var(--muted);font-size:12px}.nav{display:flex;gap:8px;overflow:auto;padding:0 0 12px;scrollbar-width:none}.nav button{white-space:nowrap}.nav button.active{border-color:var(--accent);color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}.card{background:linear-gradient(145deg,var(--panel),#11182a);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}.metric{font-size:28px;font-weight:750;margin-top:8px;overflow-wrap:anywhere}.muted{color:var(--muted)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 0}.section-head h1{font-size:23px;margin:0}.stack{display:grid;gap:11px}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.row>*{flex:0 0 auto}.user-card,.server-card{display:grid;gap:11px}.user-card h3,.server-card h3{margin:0;font-size:17px;overflow-wrap:anywhere}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-grid{display:grid;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.login{max-width:410px;margin:10vh auto}.hidden{display:none!important}.alert{padding:12px;border:1px solid #6a552e;background:#302817;border-radius:12px;margin:12px 0}.errorbox{padding:12px;border:1px solid #6b3340;background:#2d1720;border-radius:12px;margin:12px 0}.toast{position:fixed;z-index:5;bottom:calc(88px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:14px;background:#e8edff;color:#12182a;box-shadow:0 6px 28px #0008;max-width:calc(100vw - 30px)}dialog{width:min(720px,calc(100vw - 22px));max-height:88dvh;overflow:auto;border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--text);padding:18px}dialog::backdrop{background:#050812bb}.dialog-head{display:flex;justify-content:space-between;align-items:center}.preview{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,monospace;background:#090e1a;padding:14px;border-radius:12px;max-height:65vh;overflow:auto}.check{display:flex;align-items:center;gap:10px;min-height:46px}.check input{width:22px;min-height:22px}.bottomnav{position:fixed;z-index:3;bottom:0;left:0;right:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;background:#10172aee;backdrop-filter:blur(14px);border-top:1px solid var(--line)}.bottomnav button{min-height:48px;padding:7px 10px;font-size:12px}.small{font-size:13px}.notice{padding:11px 13px;border-radius:12px;background:var(--panel2);color:var(--muted)}@media(min-width:780px){.wrap{padding-top:28px}.bottomnav{position:static;background:transparent;border:0;padding:0;justify-content:flex-start}.nav{display:flex}.login{margin-top:12vh}.card{padding:19px}}
@media(prefers-color-scheme:light){:root{color-scheme:light;--bg:#eef2fb;--panel:#fff;--panel2:#f4f6fc;--line:#d9e0ef;--text:#17203a;--muted:#63708b;--accent:#536cf0}body{background:radial-gradient(ellipse at 50% -30%,#d6ddff 0,transparent 55%),var(--bg)}input,textarea,select{background:#fff}.preview{background:#f4f6fc}.bottomnav{background:#ffffffed}.alert{background:#fff7e6}.errorbox{background:#fff0f2}}
</style></head>
<body><main class="wrap">
<header class="top"><div><div class="brand">Secure X <span class="badge">администрирование</span></div><div class="muted small" id="subhead">Панель подписок</div></div><button id="logout" class="hidden">Выйти</button></header>
<section id="loginView" class="card login"><h1>Вход</h1><p class="muted">Введите данные администратора.</p><form id="loginForm" class="form-grid"><label>Имя пользователя<input name="username" autocomplete="username" required maxlength="128"></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label><button class="primary">Войти</button></form><div id="loginError" class="errorbox hidden"></div></section>
<section id="appView" class="hidden"><nav class="nav bottomnav" id="nav"><button data-page="dashboard" class="active">Обзор</button><button data-page="users">Пользователи</button><button data-page="servers">Серверы</button><button data-page="settings">Настройки</button><button data-page="sync">Синхронизация</button></nav><div id="content" aria-live="polite"></div></section>
</main><dialog id="modal"><div class="dialog-head"><h2 id="modalTitle">Детали</h2><button type="button" id="closeModal">Закрыть</button></div><div id="modalBody"></div></dialog><div id="toast" class="toast hidden"></div>
<script>
(()=>{'use strict';let csrf='',page='dashboard',busy=false;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2600)};async function api(path,opt={}){const h=new Headers(opt.headers||{});if(csrf&&opt.method&&opt.method!=='GET')h.set('X-CSRF-Token',csrf);if(opt.body&&typeof opt.body!=='string'){h.set('Content-Type','application/json');opt.body=JSON.stringify(opt.body)}const r=await fetch(path,{...opt,headers:h,credentials:'same-origin'});let x;try{x=await r.json()}catch{x=await r.text()}if(!r.ok)throw Error(typeof x==='object'?(x.detail||'Ошибка запроса'):x||'Ошибка запроса');return x}function showLogin(){ $('#loginView').classList.remove('hidden');$('#appView').classList.add('hidden');$('#logout').classList.add('hidden') }function showApp(){ $('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#logout').classList.remove('hidden');render() }$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=new FormData(e.target);const err=$('#loginError');err.classList.add('hidden');try{const x=await api('/api/admin/auth/login',{method:'POST',body:{username:b.get('username'),password:b.get('password')}});csrf=x.csrf_token;showApp()}catch(ex){err.textContent=ex.message;err.classList.remove('hidden')}});$('#logout').onclick=async()=>{try{await api('/api/admin/auth/logout',{method:'POST',body:{}})}catch{}csrf='';showLogin()};$('#closeModal').onclick=()=>$('#modal').close();$('#nav').onclick=e=>{const b=e.target.closest('[data-page]');if(!b)return;page=b.dataset.page;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));render()};
async function render(){const c=$('#content');c.innerHTML='<p class="muted">Загрузка…</p>';try{if(page==='dashboard')await dashboard(c);if(page==='users')await users(c);if(page==='servers')await servers(c);if(page==='settings')await settings(c);if(page==='sync')await sync(c)}catch(e){c.innerHTML=`<div class="errorbox">${esc(e.message)}</div>`}}
function head(title,right=''){return `<div class="section-head"><h1>${title}</h1>${right}</div>`}function fmtDate(v){if(!v)return '—';try{return new Date(v).toLocaleString('ru-RU')}catch{return v}}
async function dashboard(c){const d=await api('/api/admin/dashboard'),t=d.traffic;c.innerHTML=head('Обзор')+(!d.database.connected?`<div class="errorbox">${esc(d.database.error)}</div>`:'')+(d.upstream.warning?`<div class="alert">⚠ ${esc(d.upstream.warning)}. Используется последняя успешная копия, если она доступна.</div>`:'')+`<div class="grid"><article class="card"><div class="muted">База данных</div><div class="metric ${d.database.connected?'good':'bad'}">${d.database.connected?'Подключена':'Недоступна'}</div><div class="small muted">Supabase</div></article><article class="card"><div class="muted">Апстрим</div><div class="metric">${d.upstream.server_count} серверов</div><div class="small muted">Последнее обновление: ${esc(fmtDate(d.upstream.last_success_at))}</div></article><article class="card"><div class="muted">Пользователи</div><div class="metric">${d.users.active} / ${d.users.total}</div><div class="small muted">активны / всего · отключено ${d.users.disabled}</div></article><article class="card"><div class="muted">Общий трафик аккаунта</div><div class="metric">${t.total===0?'Безлимит':`${fmtBytes(t.upload+t.download)} / ${fmtBytes(t.total)}`}</div><div class="small muted">Загрузка ${fmtBytes(t.upload)} · скачивание ${fmtBytes(t.download)} · срок ${t.expire?fmtDate(t.expire*1000):'без срока'}</div></article><article class="card"><div class="muted">Google Apps Script</div><div class="metric ${d.sync_enabled?'good':'warn'}">${d.sync_enabled?'Подключён':'Не настроен'}</div><div class="small muted">Последний запрос: ${esc(fmtDate(d.last_script_request))}</div></article></div>`+(d.sync_errors.length?`<h2>Ошибки синхронизации</h2><div class="stack">${d.sync_errors.map(x=>`<article class="card"><b>${esc(x.name)}</b><div class="bad small">${esc(x.last_sync_error)}</div><div class="muted small">${esc(fmtDate(x.last_synced_at))}</div></article>`).join('')}</div>`:'')}
function fmtBytes(n){n=Number(n)||0;if(n===0)return '0 B';const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n.toFixed(i?1:0)} ${u[i]}`}
async function users(c){const x=await api('/api/admin/users');c.innerHTML=head('Пользователи','<button class="primary" id="addUser">＋ Добавить</button>')+(x.users.length?`<div class="stack">${x.users.map(u=>`<article class="card user-card"><div class="row"><h3>${esc(u.name)}</h3><span class="badge">${u.status==='pending_delete'?'ожидает удаления':u.enabled?'включён':'отключён'}</span><span class="badge">${u.drive_file_id?'синхронизирован':'ожидает синхронизации'}</span></div><div class="muted small">${esc(u.note||'Без заметки')} · срок: ${esc(fmtDate(u.expires_at)||'без срока')}</div><div class="actions"><button data-edit="${u.id}">Изменить</button><button data-user-servers="${u.id}">Серверы</button><button data-preview="${u.id}">Предпросмотр</button><button data-link="${u.id}" ${u.drive_file_id?'':'disabled'}>Ссылка Drive</button><button class="danger" data-delete="${u.id}" ${u.status==='pending_delete'?'disabled':''}>Удалить</button></div></article>`).join('')}</div>`:'<div class="notice">Пользователей пока нет.</div>');$('#addUser').onclick=()=>userForm();c.onclick=async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.edit)userForm(x.users.find(u=>u.id==b.dataset.edit));if(b.dataset.userServers)await userServers(b.dataset.userServers);if(b.dataset.preview){const r=await api(`/api/admin/users/${b.dataset.preview}/preview`);modal('Предпросмотр подписки',`<pre class="preview">${esc(r)}</pre>`)}if(b.dataset.link){const r=await api(`/api/admin/users/${b.dataset.link}/drive-link`);if(r.link)copy(r.link);else toast('Ссылка появится после синхронизации')}if(b.dataset.delete&&confirm('Пометить пользователя для удаления? Файл попадёт в корзину после ответа Apps Script.')){await api(`/api/admin/users/${b.dataset.delete}`,{method:'DELETE',body:{}});toast('Ожидает подтверждения синхронизации');render()}}catch(err){toast(err.message)}}}
async function userServers(id){const {servers}=await api(`/api/admin/users/${id}/servers`);modal('Серверы пользователя',`<div class="stack">${servers.map(s=>`<div class="card"><b>${esc(s.user_name||s.global_name||s.original_name)}</b><div class="small muted">${esc(s.original_name)} ${s.present_upstream?'':'· нет в апстриме'}</div><label>Имя для этого пользователя<input data-us-name="${s.id}" value="${esc(s.user_name||'')}"></label><label class="check"><input type="checkbox" data-us-hidden="${s.id}" ${s.user_hidden===true?'checked':''}> Скрыть только у этого пользователя</label><button data-us-save="${s.id}">Сохранить</button></div>`).join('')}</div>`);$('#modalBody').onclick=async e=>{const b=e.target.closest('[data-us-save]');if(!b)return;const sid=b.dataset.usSave;try{const hidden=$(`[data-us-hidden="${sid}"]`).checked;const name=$(`[data-us-name="${sid}"]`).value;await api(`/api/admin/users/${id}/servers/${sid}`,{method:'PUT',body:{hidden,custom_name:name||null}});toast('Настройка сервера сохранена')}catch(err){toast(err.message)}}}
function userForm(u){modal(u?'Пользователь':'Новый пользователь',`<form id="userForm" class="form-grid"><label>Имя<input name="name" required maxlength="120" value="${esc(u?.name||'')}"></label><label>Заметка<textarea name="note" maxlength="2000">${esc(u?.note||'')}</textarea></label><label>Срок действия<input name="expires_at" type="datetime-local" value="${u?.expires_at?new Date(u.expires_at).toISOString().slice(0,16):''}"></label><label class="check"><input name="enabled" type="checkbox" ${u?.enabled===false?'':'checked'}> Подписка включена</label><label>Заголовок профиля (необязательно)<input name="title_override" maxlength="200" value="${esc(u?.title_override||'')}"></label><label>Объявление (пусто — общее)<textarea name="announce_override" maxlength="4000">${esc(u?.announce_override||'')}</textarea></label><button class="primary">Сохранить</button></form>`);$('#userForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const date=f.get('expires_at');const body={name:f.get('name'),note:f.get('note'),enabled:f.has('enabled'),expires_at:date?new Date(date).toISOString():null,title_override:f.get('title_override')||null,announce_override:f.get('announce_override')||null};try{await api(u?`/api/admin/users/${u.id}`:'/api/admin/users',{method:u?'PUT':'POST',body});$('#modal').close();toast('Сохранено');render()}catch(err){toast(err.message)}}}
async function servers(c){let x=await api('/api/admin/servers');c.innerHTML=head('Серверы','<button id="refreshServers">Обновить из апстрима</button>')+(x.servers.length?`<div class="stack">${x.servers.map(s=>`<article class="card server-card"><div class="row"><h3>${esc(s.custom_name||s.original_name)}</h3>${!s.present_upstream?'<span class="badge warn">нет в апстриме</span>':''}</div><div class="muted small">${esc(s.original_name)} · порядок ${s.sort_order}</div><div class="split"><label>Имя<input data-name="${s.id}" value="${esc(s.custom_name||'')}"></label><label>Порядок<input data-order="${s.id}" type="number" value="${s.sort_order}"></label></div><label class="check"><input data-hidden="${s.id}" type="checkbox" ${s.hidden?'checked':''}> Скрыть сервер у всех</label><button data-save="${s.id}">Сохранить</button></article>`).join('')}</div>`:'<div class="notice">Список пока пуст. Обновите из апстрима.</div>');$('#refreshServers').onclick=async()=>{try{const r=await api('/api/admin/servers/refresh',{method:'POST',body:{}});toast(`Загружено серверов: ${r.count}`);render()}catch(e){toast(e.message)}};c.onclick=async e=>{const b=e.target.closest('[data-save]');if(!b)return;const id=b.dataset.save;try{await api(`/api/admin/servers/${id}`,{method:'PUT',body:{custom_name:$(`[data-name="${id}"]`).value||null,sort_order:Number($(`[data-order="${id}"]`).value),hidden:$(`[data-hidden="${id}"]`).checked}});toast('Сохранено')}catch(err){toast(err.message)}}}
async function settings(c){const {settings:s}=await api('/api/admin/settings');const list=(name,label)=>`<label>${label}<textarea name="${name}">${esc((s[name]||[]).join('\n'))}</textarea></label>`;c.innerHTML=head('Настройки')+`<form id="settingsForm" class="card form-grid"><label>Название профиля<input name="title" value="${esc(s.title)}"></label><label>Ссылка поддержки<input name="support_url" value="${esc(s.support_url)}"></label><label>Страница профиля<input name="web_page_url" value="${esc(s.web_page_url)}"></label><div class="split"><label>Интервал профиля (часы)<input name="update_interval" type="number" min="1" max="168" value="${s.update_interval}"></label><label>Часовой пояс<input name="timezone" value="${esc(s.timezone)}"></label></div><label class="check"><input name="announce_enabled" type="checkbox" ${s.announce_enabled?'checked':''}> Объявления включены</label><label>Обновлять объявление не чаще (минут)<input name="announce_refresh_minutes" type="number" min="5" value="${s.announce_refresh_minutes??5}"></label><div class="alert">При 10 и более пользователях рекомендуется 60 минут: частые изменения объявления могут расходовать квоту времени Apps Script. Минимум — 5 минут.</div>${list('days','Дни недели (по одному на строку)')}${list('quotes','Цитаты (по одной на строку)')}${list('footers','Нижние строки; {t} заменяется временем')}<button class="primary">Сохранить настройки</button></form>`;$('#settingsForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const v={title:f.get('title'),support_url:f.get('support_url'),web_page_url:f.get('web_page_url'),update_interval:Number(f.get('update_interval')),timezone:f.get('timezone'),announce_enabled:f.has('announce_enabled'),announce_refresh_minutes:Number(f.get('announce_refresh_minutes')),days:f.get('days').split('\n').map(x=>x.trim()).filter(Boolean),quotes:f.get('quotes').split('\n').map(x=>x.trim()).filter(Boolean),footers:f.get('footers').split('\n').map(x=>x.trim()).filter(Boolean)};try{await api('/api/admin/settings',{method:'PUT',body:{values:v}});toast('Настройки сохранены')}catch(err){toast(err.message)}}}
async function sync(c){const d=await api('/api/admin/dashboard');c.innerHTML=head('Синхронизация')+`<div class="grid"><article class="card"><div class="muted">Последний запрос Apps Script</div><div class="metric">${esc(fmtDate(d.last_script_request))}</div></article><article class="card"><div class="muted">Синхронизация</div><div class="metric ${d.sync_enabled?'good':'warn'}">${d.sync_enabled?'Активна':'Нужен SYNC_KEY'}</div><div class="small muted">Скрипт проверяет обновления каждые 5 минут.</div></article></div><h2>Проблемы пользователей</h2>${d.sync_errors.length?`<div class="stack">${d.sync_errors.map(x=>`<article class="card"><b>${esc(x.name)}</b><div class="bad">${esc(x.last_sync_error)}</div></article>`).join('')}</div>`:'<div class="notice">Ошибок синхронизации нет.</div>'}`}
function modal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').showModal()}async function copy(text){try{await navigator.clipboard.writeText(text)}catch{const el=document.createElement('textarea');el.value=text;document.body.append(el);el.select();document.execCommand('copy');el.remove()}toast('Скопировано в буфер обмена')}async function init(){try{const m=await api('/api/admin/auth/me');csrf=m.csrf_token;showApp()}catch{showLogin()}}init()})();
</script></body></html>
