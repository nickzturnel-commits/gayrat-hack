<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#08090b">
  <title>Secure X — мобильная панель</title>
  <link rel="stylesheet" href="/static/admin.css?v=20261028-7">
  <script src="/static/admin-device.js?v=20261025-1" defer></script>
  <script src="/static/admin-actions.js?v=20261025-1" defer></script>
  <script src="/static/admin.js?v=20261028-6" defer></script>
</head>
<body class="mobile-ui">
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>
  <header class="mobile-header">
    <a class="brand-lockup" href="/admin" aria-label="Secure X, главная">
      <span class="brand-symbol"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 27 9v14l-11 6L5 23V9L16 3Z"/><path d="m11 16 3.2 3.2L21.5 12"/></svg></span>
      <span><b>Secure X</b><small>ПАНЕЛЬ</small></span>
    </a>
    <button id="logout" class="button button-quiet hidden">Выйти</button>
  </header>

  <section id="loginView" class="mobile-login">
    <div class="mobile-login-mark"><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><div class="login-emblem"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6 54 18v28L32 58 10 46V18L32 6Z"/><path d="m23 32 6 6 13-14"/></svg></div></div>
    <div class="login-card surface-card">
      <p class="eyebrow">SECURE ACCESS</p><h1>Вход в систему</h1><p class="muted">Используйте учётные данные администратора.</p>
      <form id="loginForm" class="form-grid">
        <label>Имя пользователя<input name="username" autocomplete="username" required maxlength="128" placeholder="admin"></label>
        <label>Пароль<input name="password" type="password" autocomplete="current-password" required maxlength="1024" placeholder="Введите пароль"></label>
        <button class="button button-primary button-wide" type="submit"><span>Продолжить</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
      </form>
      <div id="loginError" class="error-card hidden" role="alert"></div>
      <p class="login-foot">Защищённая панель управления подписками.</p>
    </div>
  </section>

  <section id="appView" class="mobile-shell hidden">
    <main id="content" class="mobile-content" aria-live="polite" aria-busy="false"></main>
    <nav id="nav" class="mobile-nav" data-active-index="0" aria-label="Основная навигация">
      <span class="mobile-nav-glider" aria-hidden="true"></span>
      <button data-page="dashboard" class="mobile-nav-item active" aria-current="page"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7M5 9v11h14V9m-9 11v-6h4v6"/></svg><span>Обзор</span></button>
      <button data-page="users" class="mobile-nav-item"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21v-2a7 7 0 0 1 14 0v2m1-17a4 4 0 0 1 0 8m1 3a6 6 0 0 1 4 5v1"/></svg><span>Подписки</span></button>
      <button data-page="servers" class="mobile-nav-item"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01M11 7h6m-6 10h6"/></svg><span>Серверы</span></button>
      <button data-page="settings" class="mobile-nav-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19 13 2 1-2 4-2-1a8 8 0 0 1-2 1l-.4 2h-4L10 18a8 8 0 0 1-2-1l-2 1-2-4 2-1a8 8 0 0 1 0-2l-2-1 2-4 2 1a8 8 0 0 1 2-1l.4-2h4L15 6a8 8 0 0 1 2 1l2-1 2 4-2 1a8 8 0 0 1 0 2Z"/></svg><span>Настройки</span></button>
    </nav>
  </section>

  <dialog id="modal" class="modal-shell"><div class="modal-top"><div><p class="eyebrow">SECURE X</p><h2 id="modalTitle">Детали</h2></div><button type="button" id="closeModal" class="icon-button" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div id="modalBody"></div></dialog>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
</body>
</html>
