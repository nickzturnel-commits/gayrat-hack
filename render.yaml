services:
  - type: web
    name: vpn-subscription-relay
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUBSCRIPTION_URL
        sync: false
      - key: UPSTREAM_X_HWID
        sync: false
      - key: UPSTREAM_USER_AGENT
        sync: false
